name: Gmail Outreach Tests
on:
  workflow_dispatch:
  push:
    paths: ['apps-script/**', 'tests/**', '.github/workflows/outreach-tests.yml']
  pull_request:
    paths: ['apps-script/**', 'tests/**', '.github/workflows/outreach-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/outreach.test.cjs
